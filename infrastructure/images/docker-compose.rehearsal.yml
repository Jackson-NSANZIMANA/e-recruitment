# ══════════════════════════════════════════════════════════════════
# USRP from its IMAGES (ADR-038) — the rehearsal stack.
#
# Runs the twelve service images and the two SPA images (built from
# e-recruitment-ui, infrastructure/images/spa/Dockerfile) against the
# developer's tier1/tier2 infrastructure — the same Postgres server, MinIO,
# ClamAV and G2G mocks — without touching what is already running there:
#
#   • its own compose project (driven by infrastructure/images/rehearse.sh as
#     `-p usrp-s03` by default), so `down` removes only what this file started;
#   • its OWN database on the shared Postgres server (USRP_REHEARSAL_DB,
#     default usrp_images), bootstrapped by rehearse.sh and dropped on `down`;
#   • its OWN Kafka broker, so these services never join the consumer groups
#     of a developer's `pnpm dev` or of a proof run on the shared broker;
#   • host ports only for the two SPAs (USRP_APPLICANT_PORT / USRP_OFFICER_PORT).
#     The SPAs proxy /edge to the gateway, so the browser sees one origin per
#     app, exactly as in production.
#
# The images run with NODE_ENV=development: the published dev secrets below
# are what the production boot guard exists to refuse. Same bytes, dev config.
#
# Usage: infrastructure/images/rehearse.sh up | rehearse | status | down
# ══════════════════════════════════════════════════════════════════

networks:
  stack:
    driver: bridge
  infra:
    external: true
    name: usrp-tier1_usrp-internal

x-service: &service
  restart: "no"
  networks: [stack, infra]
  # The production posture, proved here: no root, no capabilities, nothing
  # written to the image filesystem.
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file: ../../.env.example
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-env: &env
  NODE_ENV: development
  DATABASE_URL: postgresql://usrp_app:app_pw@usrp-postgres:5432/${USRP_REHEARSAL_DB:-usrp_images}
  DATABASE_MAX_CONNECTIONS: "5"
  KAFKA_BROKERS: stack-kafka:9092
  IAM_BASE_URL: http://iam-service:4011
  APPLICATION_SERVICE_BASE_URL: http://application-service:4006
  SCHEDULING_SERVICE_BASE_URL: http://scheduling-service:4007
  IDENTITY_SERVICE_BASE_URL: http://identity-service:4001
  FIELD_SYNC_SERVICE_BASE_URL: http://field-sync-service:4009
  BIOMETRIC_SERVICE_BASE_URL: http://biometric-service:4003
  DOCUMENT_FORENSICS_BASE_URL: http://document-forensics-service:4004
  NIDA_BASE_URL: http://usrp-g2g-sandbox:3100
  NIDA_CLIENT_TOKEN: dev_g2g_sandbox_client_token
  NESA_BASE_URL: http://usrp-g2g-sandbox:3100
  RIB_BASE_URL: http://usrp-rib-mock:3102
  HEC_BASE_URL: http://usrp-hec-mock:3103
  MINIO_ENDPOINT: usrp-minio
  CLAMAV_HOST: usrp-clamav
  DEV_SMS_INBOX_FILE: /sms/inbox.jsonl
  CORS_ORIGINS: http://localhost:${USRP_APPLICANT_PORT:-3510},http://localhost:${USRP_OFFICER_PORT:-3511}
  EDGE_COOKIE_SECURE: "false"
  # The SPA container is the one proxy hop in front of the gateway.
  EDGE_TRUSTED_PROXY_HOPS: "1"

services:
  stack-kafka:
    image: confluentinc/cp-kafka:7.7.0
    restart: "no"
    networks: [stack]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@stack-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://stack-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx384M -Xms192M"
      CLUSTER_ID: "UzAzSW1hZ2VzUmVoZWFyc2Fs"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Same topic set as infrastructure/docker/docker-compose.tier2.yml.
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    restart: "no"
    networks: [stack]
    depends_on:
      stack-kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for spec in applicant.submitted:12 vetting.nida:6 vetting.nesa:6 vetting.hec:6 vetting.rib:6 vetting.age:6 application.cleared:6 application.accepted:6 application.withdrawn:6 biometric.result:6 slot.assigned:6 field.score.captured:6 notification.delivered:6 document.forensics:6 campaign.lifecycle:6; do
          topic=$${spec%%:*}; parts=$${spec##*:}
          kafka-topics --create --if-not-exists --topic $$topic --partitions $$parts --replication-factor 1 --config retention.ms=604800000 --bootstrap-server stack-kafka:9092
        done
        kafka-topics --create --if-not-exists --topic audit.immutable --partitions 3 --replication-factor 1 --config retention.ms=-1 --bootstrap-server stack-kafka:9092
        kafka-topics --create --if-not-exists --topic events.dead-letter --partitions 3 --replication-factor 1 --config retention.ms=2592000000 --bootstrap-server stack-kafka:9092

  identity-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}identity-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
    volumes: ["${USRP_SMS_DIR:?set USRP_SMS_DIR}:/sms"]
    # The dev SMS inbox is read by host tooling (pnpm dev:sms, the live
    # spec), so the two processes that write it run as the host user.
    user: "${USRP_HOST_UID:-1000}:${USRP_HOST_GID:-1000}"
  eligibility-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}eligibility-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  biometric-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}biometric-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  document-forensics-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}document-forensics-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  background-vetting-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}background-vetting-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  application-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}application-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  scheduling-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}scheduling-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  notification-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}notification-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
    volumes: ["${USRP_SMS_DIR:?set USRP_SMS_DIR}:/sms"]
    # The dev SMS inbox is read by host tooling (pnpm dev:sms, the live
    # spec), so the two processes that write it run as the host user.
    user: "${USRP_HOST_UID:-1000}:${USRP_HOST_GID:-1000}"
  field-sync-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}field-sync-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  audit-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}audit-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  iam-service:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}iam-service:${USRP_IMAGE_TAG:-dev}
    environment: *env
  edge-gateway:
    <<: *service
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}edge-gateway:${USRP_IMAGE_TAG:-dev}
    environment: *env

  applicant-portal:
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}applicant-portal:${USRP_IMAGE_TAG:-dev}
    restart: "no"
    networks: [stack]
    read_only: true
    tmpfs: ["/tmp:uid=65532,gid=65532"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      USRP_EDGE_MODE: proxy
      USRP_EDGE_UPSTREAM: http://edge-gateway:4021
    ports: ["127.0.0.1:${USRP_APPLICANT_PORT:-3510}:8080"]
  officer-console:
    image: ${USRP_IMAGE_PREFIX:-usrp-s03/}officer-console:${USRP_IMAGE_TAG:-dev}
    restart: "no"
    networks: [stack]
    read_only: true
    tmpfs: ["/tmp:uid=65532,gid=65532"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      USRP_EDGE_MODE: proxy
      USRP_EDGE_UPSTREAM: http://edge-gateway:4021
    ports: ["127.0.0.1:${USRP_OFFICER_PORT:-3511}:8080"]
