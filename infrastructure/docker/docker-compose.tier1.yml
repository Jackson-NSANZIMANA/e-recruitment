# ══════════════════════════════════════════════════════════════════
# USRP — TIER 1 INFRASTRUCTURE (Phase 1-2 Development)
# RAM budget: ~1.5GB
# Includes: PostgreSQL, Redis, MinIO, Kong, G2G Mocks (NIDA/NESA/RIB/HEC)
# Mock data files are VOLUME MOUNTED — update JSON without rebuilding
# ══════════════════════════════════════════════════════════════════

name: usrp-tier1

networks:
  usrp-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: usrp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usrp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usrp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-usrp_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/01-create-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
      - ./init-scripts/02-create-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ./init-scripts/03-rls-policies.sql:/docker-entrypoint-initdb.d/03-rls.sql:ro
      - ./init-scripts/04-create-extensions.sql:/docker-entrypoint-initdb.d/04-extensions.sql:ro
    ports:
      - "5432:5432"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usrp_admin} -d ${POSTGRES_DB:-usrp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis 7.2 ───────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: usrp-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-usrp_redis_dev}
      --save 60 1
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-usrp_redis_dev} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # ── MinIO Object Store ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: usrp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-usrp_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-usrp_minio_dev_password}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Kong API Gateway (DB-less mode) ─────────────────────────────
  kong:
    image: kong:3.7-ubuntu
    container_name: usrp-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.dev.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./kong/kong.dev.yml:/kong/declarative/kong.dev.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M

  # ── G2G Mock: NIDA ──────────────────────────────────────────────
  # Data mounted from host — update citizens.json without rebuilding
  nida-mock:
    build:
      context: ./mocks/nida
      dockerfile: Dockerfile
    container_name: usrp-nida-mock
    restart: unless-stopped
    environment:
      PORT: 3100
      MOCK_DATA_FILE: /app/data/citizens.json
      HMAC_SECRET: ${NIDA_HMAC_SECRET:-dev_nida_hmac_secret}
    volumes:
      - ./mocks/nida/data:/app/data:ro
    ports:
      - "3100:3100"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── G2G Mock: NESA ──────────────────────────────────────────────
  nesa-mock:
    build:
      context: ./mocks/nesa
      dockerfile: Dockerfile
    container_name: usrp-nesa-mock
    restart: unless-stopped
    environment:
      PORT: 3101
      MOCK_DATA_FILE: /app/data/results.json
      HMAC_SECRET: ${NESA_HMAC_SECRET:-dev_nesa_hmac_secret}
    volumes:
      - ./mocks/nesa/data:/app/data:ro
    ports:
      - "3101:3101"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3101/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── G2G Mock: RIB ───────────────────────────────────────────────
  rib-mock:
    build:
      context: ./mocks/rib
      dockerfile: Dockerfile
    container_name: usrp-rib-mock
    restart: unless-stopped
    environment:
      PORT: 3102
      MOCK_DATA_FILE: /app/data/records.json
      HMAC_SECRET: ${RIB_HMAC_SECRET:-dev_rib_hmac_secret}
    volumes:
      - ./mocks/rib/data:/app/data:ro
    ports:
      - "3102:3102"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3102/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── G2G Mock: HEC (Higher Education Council) ─────────────────────
  hec-mock:
    build:
      context: ./mocks/hec
      dockerfile: Dockerfile
    container_name: usrp-hec-mock
    restart: unless-stopped
    environment:
      PORT: 3103
      MOCK_DATA_FILE: /app/data/degrees.json
    volumes:
      - ./mocks/hec/data:/app/data:ro
    ports:
      - "3103:3103"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3103/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
