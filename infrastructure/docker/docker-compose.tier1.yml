# ══════════════════════════════════════════════════════════════════
# USRP — TIER 1 INFRASTRUCTURE (Phase 1-2 Development)
# RAM budget: ~1.5GB
# Includes: PostgreSQL, MinIO, G2G sandbox simulators (NIDA/NESA, ADR-047), RIB/HEC mocks
# Redis + Kong REMOVED 2026-07-19: zero consumers in any service, both
# shipped broken (Kong crashloop, Redis bad healthcheck flag) and Kong
# blocked the first real CI run. Re-add per-need with a working config.
# Mock data files are VOLUME MOUNTED — update JSON without rebuilding
# ══════════════════════════════════════════════════════════════════

name: usrp-tier1

networks:
  usrp-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: usrp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usrp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usrp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-usrp_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # NO schema init here: drizzle migration 0000 OWNS schema creation
      # (CREATE SCHEMA without IF NOT EXISTS). Pre-creating schemas at
      # initdb made every COLD bootstrap fail ("schema audit_log already
      # exists") — invisible on warm dev volumes whose drizzle journal
      # predated the init script, fatal on every CI runner.
      - ./init-scripts/02-create-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ./init-scripts/03-rls-policies.sql:/docker-entrypoint-initdb.d/03-rls.sql:ro
      - ./init-scripts/04-create-extensions.sql:/docker-entrypoint-initdb.d/04-extensions.sql:ro
    ports:
      - "5432:5432"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usrp_admin} -d ${POSTGRES_DB:-usrp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── MinIO Object Store ──────────────────────────────────────────
  # `minio/minio` and `minio/mc` were removed from Docker Hub between 2026-09-09 and 2026-09-14 (the
  # repo 404s; Docker's error reads like an auth failure, it is not one). MinIO's community edition is
  # source-only, so no new image is coming. This file pins a mirror of the last official build,
  # RELEASE.2025-09-07T16-13-09Z, in our own registry, by digest so it can never change silently.
  #
  # KNOWN ISSUE in that build: RELEASE.2025-10-15T17-29-55Z, the final community release, carries
  # upstream c1a4949 "fix: check sub-policy properly when present" (a service account could create
  # service accounts outside its inline policy). infrastructure/docker/minio/Dockerfile builds that
  # release from pinned, checksum-verified source (the sandbox already uses it). To move this file to it:
  #   docker build -t ghcr.io/jackson-nsanzimana/usrp-minio:RELEASE.2025-10-15T17-29-55Z infrastructure/docker/minio
  #   docker push ghcr.io/jackson-nsanzimana/usrp-minio:RELEASE.2025-10-15T17-29-55Z
  # and pin the digest the push prints. The image is `scratch`-based: `mc` is present (healthcheck
  # unchanged), a shell is not.
  minio:
    image: ghcr.io/jackson-nsanzimana/usrp-minio@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
    container_name: usrp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-usrp_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-usrp_minio_dev_password}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── G2G sandbox simulators: NIDA (IremboGov format) + NESA (SDMS format) ──
  # ADR-047. Replaces the retired hash-keyed nida-mock/nesa-mock. ONE process
  # (tools/g2g-sandbox) mounts every simulator; it speaks the captured wire
  # formats, refuses to start in production, and stamps x-usrp-sandbox: 1 on
  # every response. It runs the BUILT workspace (run `pnpm build` first; the
  # container restarts until dist/ exists). Published on 3100 AND 3101, so the
  # existing NIDA_BASE_URL / NESA_BASE_URL defaults keep working.
  g2g-sandbox:
    image: node:24-bookworm-slim@sha256:6042915a8b58012e6699f998ed96bca43ec9d8582447bdb68bc2445d0fafeb79
    container_name: usrp-g2g-sandbox
    restart: unless-stopped
    working_dir: /repo
    command: ["node", "tools/g2g-sandbox/dist/main.js"]
    environment:
      USRP_ENVIRONMENT: development
      SANDBOX_PORT: 3100
      SANDBOX_LATENCY_SCALE: "0"
      # ADR-053: the simulator binds loopback by default. Inside a container the
      # published port still needs 0.0.0.0 here; the HOST side stays loopback
      # because the port mapping below is 127.0.0.1:3100.
      SANDBOX_BIND_HOST: "0.0.0.0"
    volumes:
      - ../..:/repo:ro
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:3101:3100"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 256M

  # ── G2G Mock: RIB ───────────────────────────────────────────────
  rib-mock:
    build:
      context: ./mocks/rib
      dockerfile: Dockerfile
    container_name: usrp-rib-mock
    restart: unless-stopped
    environment:
      PORT: 3102
      MOCK_DATA_FILE: /app/data/records.json
      HMAC_SECRET: ${RIB_HMAC_SECRET:-dev_rib_hmac_secret}
    volumes:
      - ./mocks/rib/data:/app/data:ro
    ports:
      - "3102:3102"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3102/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── G2G Mock: HEC (Higher Education Council) ─────────────────────
  hec-mock:
    build:
      context: ./mocks/hec
      dockerfile: Dockerfile
    container_name: usrp-hec-mock
    restart: unless-stopped
    environment:
      PORT: 3103
      MOCK_DATA_FILE: /app/data/degrees.json
    volumes:
      - ./mocks/hec/data:/app/data:ro
    ports:
      - "3103:3103"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3103/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M