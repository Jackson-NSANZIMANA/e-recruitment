# ══════════════════════════════════════════════════════════════════
# USRP — TIER 2 INFRASTRUCTURE (Phase 3+ Backend Development)
# Extends Tier 1. Adds: Kafka (KRaft), Schema Registry, ClamAV
# RAM budget: ~1.5GB additional (total ~2.9GB with Tier 1)
# KRaft mode: NO Zookeeper — saves 256MB RAM
# ══════════════════════════════════════════════════════════════════

name: usrp-tier2

networks:
  usrp-internal:
    external: true
    name: usrp-tier1_usrp-internal

volumes:
  kafka-data:
    driver: local
  clamav-data:
    driver: local

services:

  # ── Apache Kafka 3.7 (KRaft — No Zookeeper) ─────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: usrp-kafka
    restart: unless-stopped
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two client listeners: PLAINTEXT (kafka:9092) for in-network containers,
      # EXTERNAL (localhost:29092) so host processes — services run with tsx/node
      # on the host in dev, and the self-checks — can produce/consume. A broker
      # advertising only kafka:9092 is unreachable from the host after the initial
      # metadata round-trip; this dual listener is the standard Confluent fix.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single-broker replication factors. Without these the internal
      # __consumer_offsets / transaction-state topics default to RF=3, which a
      # 1-broker cluster can never create — so the group coordinator is
      # unavailable and NO consumer group can ever form (producers still work,
      # which is why this stays hidden until you actually consume). RF=1 fixes it.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Performance tuning for dev (reduced for RAM constraints)
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # JVM heap — critical for RAM management
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 640M

  # ── Kafka Topic Initializer ──────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: usrp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - usrp-internal
    # NOTE: single-line commands driven by a loop — NOT backslash line
    # continuations. YAML block scalars preserve trailing whitespace, and a
    # space after a `\` silently breaks bash line-continuation, which is why an
    # earlier multi-line version created NO topics. Keep each command on one line.
    # command is a SINGLE-ELEMENT LIST so the whole script is passed as one
    # argv to `bash -c`. Shell `$` MUST be written `$$` — Compose interpolates
    # `${...}` as its own variables otherwise, blanking $topic/$parts and failing
    # with "invalid interpolation format". (Both this and the earlier backslash-
    # continuation form silently created NO topics — hence the escaping notes.)
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo 'Creating USRP Kafka topics...'
        for spec in applicant.submitted:12 vetting.nida:6 vetting.nesa:6 vetting.hec:6 vetting.rib:6 vetting.age:6 application.cleared:6 biometric.result:6 slot.assigned:6 field.score.captured:6; do
          topic=$${spec%%:*}; parts=$${spec##*:}
          kafka-topics --create --if-not-exists --topic $$topic --partitions $$parts --replication-factor 1 --config retention.ms=604800000 --bootstrap-server kafka:9092
        done
        kafka-topics --create --if-not-exists --topic audit.immutable --partitions 3 --replication-factor 1 --config retention.ms=-1 --config cleanup.policy=delete --bootstrap-server kafka:9092
        echo 'All USRP topics created successfully.'
        kafka-topics --list --bootstrap-server kafka:9092
    restart: on-failure

  # ── Confluent Schema Registry ────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: usrp-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx128M -Xms64M"
    ports:
      - "8081:8081"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── ClamAV Virus Scanner ─────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: usrp-clamav
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "3310:3310"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Kafka UI (Dev tooling only) ──────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: usrp-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: usrp-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - usrp-internal
    deploy:
      resources:
        limits:
          memory: 256M
