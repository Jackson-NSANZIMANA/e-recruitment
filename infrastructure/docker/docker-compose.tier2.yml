# ══════════════════════════════════════════════════════════════════
# USRP — TIER 2 INFRASTRUCTURE (Phase 3+ Backend Development)
# Extends Tier 1. Adds: Kafka (KRaft), Schema Registry, ClamAV
# RAM budget: ~1.5GB additional (total ~2.9GB with Tier 1)
# KRaft mode: NO Zookeeper — saves 256MB RAM
# ══════════════════════════════════════════════════════════════════

name: usrp-tier2

networks:
  usrp-internal:
    external: true
    name: usrp-tier1_usrp-internal

volumes:
  kafka-data:
    driver: local
  clamav-data:
    driver: local

services:

  # ── Apache Kafka 3.7 (KRaft — No Zookeeper) ─────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: usrp-kafka
    restart: unless-stopped
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Performance tuning for dev (reduced for RAM constraints)
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # JVM heap — critical for RAM management
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 640M

  # ── Kafka Topic Initializer ──────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.7.0
    container_name: usrp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - usrp-internal
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating USRP Kafka topics...'

      kafka-topics --create --if-not-exists \
        --topic applicant.submitted \
        --partitions 12 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --bootstrap-server kafka:9092

      kafka-topics --create --if-not-exists \
        --topic vetting.nida \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --bootstrap-server kafka:9092

      kafka-topics --create --if-not-exists \
        --topic vetting.nesa \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --bootstrap-server kafka:9092

      kafka-topics --create --if-not-exists \
        --topic vetting.rib \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --bootstrap-server kafka:9092

      kafka-topics --create --if-not-exists \
        --topic biometric.result \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --bootstrap-server kafka:9092

      kafka-topics --create --if-not-exists \
        --topic slot.assigned \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --bootstrap-server kafka:9092

      kafka-topics --create --if-not-exists \
        --topic field.score.captured \
        --partitions 6 \
        --replication-factor 1 \
        --config retention.ms=604800000 \
        --bootstrap-server kafka:9092

      kafka-topics --create --if-not-exists \
        --topic audit.immutable \
        --partitions 3 \
        --replication-factor 1 \
        --config retention.ms=-1 \
        --config cleanup.policy=delete \
        --bootstrap-server kafka:9092

      echo 'All USRP topics created successfully.'
      kafka-topics --list --bootstrap-server kafka:9092
      "
    restart: on-failure

  # ── Confluent Schema Registry ────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: usrp-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx128M -Xms64M"
    ports:
      - "8081:8081"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── ClamAV Virus Scanner ─────────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: usrp-clamav
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "3310:3310"
    networks:
      - usrp-internal
    healthcheck:
      test: ["CMD", "clamdcheck"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Kafka UI (Dev tooling only) ──────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: usrp-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: usrp-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - usrp-internal
    deploy:
      resources:
        limits:
          memory: 256M
