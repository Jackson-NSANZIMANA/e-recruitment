openapi: 3.1.0
info:
  title: e-recruitment Edge Gateway
  description: |
    The EDGE RUNTIME CONTRACT — the single trusted browser boundary.
    
    All 57 operations mount under `/edge/v1/**`. The browser never calls service
    ports directly, never holds upstream credentials, and never declares agency:
    the edge serves opaque session cookies and derives agency from the verified
    officer session.
    
    This document is maintained alongside the operation registry
    (services/edge-gateway/src/domain/edge-operations.ts). The required
    selfcheck/verify-edge-contract.ts compares the mounted routes, registry,
    public allowlist, upstream catalogue, and OpenAPI operation IDs.
  version: "2026-09-13"
  contact:
    name: Backend Architecture
    email: backend-arch@example.com
servers:
  - url: https://recruitment.example.com
    description: Production edge gateway
  - url: http://localhost:3000
    description: Local development (insecure, testing only)

paths:
  /edge/v1/session:
    get:
      operationId: readSession
      summary: Read the current session
      tags: [session]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      responses:
        '200':
          description: Session state
        '401':
          description: No session

  /edge/v1/session/refresh:
    post:
      operationId: refreshSession
      summary: Refresh the session handle and CSRF token
      tags: [session]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      responses:
        '200':
          description: New session
        '403':
          description: CSRF invalid

  /edge/v1/auth/officer/login:
    post:
      operationId: officerLogin
      summary: Officer login
      tags: [officer-auth]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited

  /edge/v1/auth/officer/logout:
    post:
      operationId: officerLogout
      summary: Officer logout
      tags: [officer-auth]
      x-usrp-session: officer
      x-usrp-permission: none
      x-usrp-outcomes: {}
      x-usrp-csrf: true
      x-usrp-idempotent-without-session: true
      responses:
        '204':
          description: Logged out
        '403':
          description: CSRF invalid

  /edge/v1/auth/applicant/identity:
    post:
      operationId: beginApplicantOnboarding
      summary: Confirm National ID and date of birth against NIDA (onboarding step 1)
      tags: [applicant-auth]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      responses:
        '200':
          description: Confirmed; a short-lived onboarding token is returned
        '422':
          description: Details could not be confirmed (one body for every non-match)
        '429':
          description: Rate limited

  /edge/v1/auth/applicant/otp/request:
    post:
      operationId: requestApplicantOtp
      summary: Send an OTP to the stated phone number (onboarding step 2)
      tags: [applicant-auth]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: true
      responses:
        '202':
          description: OTP request accepted
        '401':
          description: Onboarding token missing or expired
        '429':
          description: Rate limited

  /edge/v1/auth/applicant/otp/verify:
    post:
      operationId: verifyApplicantOtp
      summary: Verify the OTP and open the applicant session (onboarding step 3)
      tags: [applicant-auth]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      responses:
        '200':
          description: Verified
        '401':
          description: Invalid OTP

  /edge/v1/auth/applicant/logout:
    post:
      operationId: logoutApplicant
      summary: Applicant logout
      tags: [applicant-auth]
      x-usrp-session: applicant
      x-usrp-csrf: true
      x-usrp-idempotent-without-session: true
      responses:
        '204':
          description: Logged out
        '403':
          description: CSRF invalid

  /edge/v1/campaigns:
    post:
      operationId: createCampaign
      summary: Create a campaign draft
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-permission: campaign.create
      x-usrp-outcomes: { 409: [PUBLIC_CODE_ALREADY_EXISTS, CAMPAIGN_LABEL_ALREADY_EXISTS, CAMPAIGN_WRITE_CONFLICT, IDEMPOTENCY_KEY_REUSED], 422: [CATEGORY_AGENCY_MISMATCH, INVALID_REGISTRATION_WINDOW, INVALID_EXAMINATION_WINDOW] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode, campaignLabel, targetCategories, targetDistricts, registrationOpensAt, registrationClosesAt, examinationStartDate, examinationEndDate, examinationReportingHour, allowsWalkIn]
              properties:
                publicCode: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Z0-9][A-Z0-9-]*$' }
                campaignLabel: { type: string, minLength: 1, maxLength: 50 }
                targetCategories: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
                targetDistricts: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
                registrationOpensAt: { type: string, format: date-time }
                registrationClosesAt: { type: string, format: date-time }
                examinationStartDate: { type: string, format: date }
                examinationEndDate: { type: string, format: date }
                examinationReportingHour: { type: integer, minimum: 0, maximum: 23 }
                allowsWalkIn: { type: boolean }
                targetIntakeCount: { type: [integer, 'null'], minimum: 1 }
                contactPhoneNumbers: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
                contactWebsite: { type: [string, 'null'], maxLength: 100, format: uri }
      responses:
        '201': { description: Draft created; replay returns the stored original body. }
        '400': { description: Invalid draft or idempotency key. }
        '403': { description: Officer lacks campaign.create permission. }
        '409': { description: Public code or campaign label conflict. }
        '422': { description: Category, agency, or campaign-window validation failed. }
        '503': { description: Campaign persistence unavailable. }
    get:
      operationId: listCampaigns
      summary: List open published campaigns
      tags: [public-campaigns]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200': { description: Only REGISTRATION_OPEN campaigns with the safe public projection. }
        '503': { description: Public campaign read unavailable. }

  /edge/v1/campaigns/policy:
    post:
      operationId: createCampaignPolicy
      summary: Create an immutable policy version
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-permission: campaign.policy.create
      x-usrp-outcomes: { 409: [INVALID_STATE, POLICY_VERSION_CONFLICT, POLICY_HASH_MISMATCH, IDEMPOTENCY_KEY_REUSED], 422: [INVALID_POLICY, POLICY_CATEGORY_COVERAGE_MISMATCH] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode, policyDocument, legalBasisCode, legalBasisReference]
              properties:
                publicCode: { type: string }
                policyDocument:
                  type: object
                  minProperties: 1
                  description: One complete policy entry per target category; official values are supplied by the authorized officer, not defaulted by this API.
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    required: [age, education, criminalThreshold, requiredDocumentTypes, medicalMode, legalBasis]
                    properties:
                      age:
                        type: object
                        additionalProperties: false
                        required: [minimumAge, maximumAge, referenceDate]
                        properties:
                          minimumAge: { type: integer, minimum: 0, maximum: 130 }
                          maximumAge: { type: integer, minimum: 0, maximum: 130 }
                          referenceDate: { type: string, format: date }
                      education:
                        type: object
                        additionalProperties: false
                        required: [mode, threshold]
                        properties:
                          mode: { type: string }
                          threshold: { oneOf: [{ type: string }, { type: number }] }
                      criminalThreshold: { type: string }
                      requiredDocumentTypes: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
                      medicalMode: { type: string }
                      legalBasis:
                        type: object
                        additionalProperties: false
                        required: [code, reference]
                        properties:
                          code: { type: string }
                          reference: { type: string, maxLength: 256 }
                legalBasisCode: { type: string }
                legalBasisReference: { type: string, maxLength: 256 }
      responses:
        '201': { description: Immutable policy version created; response includes its canonical SHA-256 hash. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.policy.create permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Policy cannot be amended in the current campaign state. }
        '422': { description: Policy shape or target-category coverage is invalid. }

  /edge/v1/campaigns/session:
    post:
      operationId: configureCampaignSession
      summary: Configure one scheduling-owned district session
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-permission: campaign.session.configure
      x-usrp-outcomes: { 409: [INVALID_STATE, SESSION_ALREADY_RESERVED, STALE_COVERAGE, INCOMPLETE_COVERAGE, CAPACITY_DECISION_REQUIRED, IDEMPOTENCY_KEY_REUSED], 422: [INVALID_SESSION_CONFIGURATION, INVALID_SESSION_DATE, INVALID_REPORTING_HOUR, DISTRICT_PROVINCE_MISMATCH] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode, district, province, venueName, examDate, reportingTimeHour, capacityLimit, isActive]
              properties:
                publicCode: { type: string }
                district: { type: string }
                province: { type: string }
                venueName: { type: string, minLength: 1, maxLength: 200 }
                examDate: { type: string, format: date }
                reportingTimeHour: { type: integer, minimum: 0, maximum: 23 }
                capacityLimit: { type: [integer, 'null'], minimum: 1 }
                # Required as UNBOUNDED_CAPACITY when capacityLimit is null; ignored only when absent for finite capacity.
                capacityDecisionCode: { type: string, enum: [UNBOUNDED_CAPACITY] }
                isActive: { type: boolean }
      responses:
        '200': { description: Session configured or identical request replayed; includes coverage version/hash for officers. }
        '400': { description: Invalid session shape or idempotency key. }
        '403': { description: Officer lacks campaign.session.configure permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: State, reserved-session, idempotency, or coverage conflict. }
        '422': { description: District or exam-date configuration is invalid. }

  /edge/v1/campaigns/publish:
    post:
      operationId: publishCampaign
      summary: Publish a validated draft and open registration
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-permission: campaign.publish
      x-usrp-outcomes: { 409: [INVALID_STATE, POLICY_NOT_SET, INCOMPLETE_COVERAGE, STALE_COVERAGE, POLICY_HASH_MISMATCH, INVALID_CAPACITY, CAPACITY_DECISION_REQUIRED, IDEMPOTENCY_KEY_REUSED] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Published; policy version and exact coverage evidence are stored. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.publish permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid state, missing policy, incomplete coverage, or invalid capacity. }
        '422': { description: Policy/coverage hash or capacity validation failed. }

  /edge/v1/campaigns/registration-close:
    post:
      operationId: closeCampaignRegistration
      summary: Close campaign registration
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-permission: campaign.registration.close
      x-usrp-outcomes: { 409: [INVALID_STATE, IDEMPOTENCY_KEY_REUSED] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Registration closed. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.registration.close permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid lifecycle transition. }

  /edge/v1/campaigns/complete:
    post:
      operationId: completeCampaign
      summary: Complete a campaign after registration closes
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-permission: campaign.complete
      x-usrp-outcomes: { 409: [INVALID_STATE, IDEMPOTENCY_KEY_REUSED] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Campaign completed after registration closure. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.complete permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid lifecycle transition. }

  /edge/v1/campaigns/cancel:
    post:
      operationId: cancelCampaign
      summary: Cancel a permitted campaign
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-permission: campaign.cancel
      x-usrp-outcomes: { 409: [INVALID_STATE, CANCELLATION_HAS_APPLICATIONS, IDEMPOTENCY_KEY_REUSED] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Campaign cancelled where the lifecycle and application-count rules permit it. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.cancel permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid lifecycle transition or applications prevent cancellation. }

  /edge/v1/campaigns/detail:
    get:
      operationId: getCampaignDetail
      summary: Read an externally published campaign by public code
      tags: [public-campaigns]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - name: publicCode
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 64 }
      responses:
        '200': { description: Public projection only; internal UUIDs, policies, coverage, capacity, registrations, and audit facts are omitted. }
        '400': { description: Invalid or missing publicCode. }
        '404': { description: Campaign is not externally published or does not exist. }
        '503': { description: Public campaign read unavailable. }

  /edge/v1/applications:
    get:
      operationId: listApplications
      summary: List applications
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-permission: application.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: Applications list
        '401':
          description: Unauthorized

  /edge/v1/applications/amber-queue:
    get:
      operationId: listAmberQueue
      summary: List amber queue
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-permission: adjudication.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: Amber queue
        '401':
          description: Unauthorized

  /edge/v1/applications/by-id:
    get:
      operationId: findApplicationById
      summary: Find application by ID
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-permission: application.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application found
        '404':
          description: Not found

  /edge/v1/applications/detail:
    get:
      operationId: getApplicationDetail
      summary: Get application with history
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-permission: application.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      x-usrp-composition: composed
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application with history
        '404':
          description: Not found

  /edge/v1/applications/status-history:
    get:
      operationId: getApplicationStatusHistory
      summary: Get status history
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-permission: application.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status history
        '404':
          description: Not found

  /edge/v1/applications/medical-review:
    post:
      operationId: recordMedicalReview
      summary: Record medical review
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-permission: medical.review
      x-usrp-outcomes: { 409: [ILLEGAL_TRANSITION], 422: [INVALID_MEDICAL_INPUT] }
      x-usrp-csrf: true
      responses:
        '422':
          description: "INVALID_MEDICAL_INPUT (detail = the agency medical mode; never render)"
        '200':
          description: Recorded
        '409':
          description: Conflict

  /edge/v1/applications/final-decision:
    post:
      operationId: recordFinalDecision
      summary: Record final decision
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-permission: decision.final
      x-usrp-outcomes: { 409: [ILLEGAL_TRANSITION] }
      x-usrp-csrf: true
      responses:
        '200':
          description: Recorded
        '409':
          description: Conflict

  /edge/v1/applications/accept:
    post:
      operationId: acceptApplication
      summary: Accept application
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-permission: application.accept
      x-usrp-outcomes: { 409: [ILLEGAL_TRANSITION, CROSS_AGENCY_ACCEPT_LOCK] }
      x-usrp-csrf: true
      responses:
        '200':
          description: Accepted
        '409':
          description: Conflict

  /edge/v1/applications/adjudicate:
    post:
      operationId: adjudicateApplication
      summary: Adjudicate application
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-permission: adjudication.decide
      x-usrp-outcomes: { 409: [ILLEGAL_TRANSITION] }
      x-usrp-csrf: true
      responses:
        '200':
          description: Adjudicated
        '409':
          description: Conflict

  /edge/v1/applications/walk-in/register:
    post:
      operationId: registerWalkIn
      summary: Register walk-in
      tags: [walk-in]
      x-usrp-session: officer
      x-usrp-permission: walkin.register
      x-usrp-outcomes: { 409: [IDENTITY_NOT_VERIFIED, NO_WALK_IN_CAMPAIGN, ALREADY_APPLIED], 422: [INVALID_ACADEMIC_INPUT, VALIDATION_FAILED] }
      x-usrp-csrf: true
      responses:
        '422':
          description: "INVALID_ACADEMIC_INPUT | VALIDATION_FAILED"
        '201':
          description: Registered
        '403':
          description: Forbidden for this agency
        '409':
          description: >-
            ALREADY_APPLIED (ADR-027) — this candidate already holds a live
            application for the campaign and category. Carries applicationId
            and processingCode so the tablet can open the existing record
            instead of creating a second one.

  /edge/v1/applications/walk-in/vet:
    post:
      operationId: vetWalkIn
      summary: Vet walk-in
      tags: [walk-in]
      x-usrp-session: officer
      x-usrp-permission: walkin.vet
      x-usrp-outcomes: { 409: [AGE_PENDING, ILLEGAL_TRANSITION], 422: [VALIDATION_FAILED] }
      x-usrp-csrf: true
      responses:
        '409':
          description: "AGE_PENDING (retry shortly) | ILLEGAL_TRANSITION"
        '422':
          description: "VALIDATION_FAILED"
        '200':
          description: Vetted
        '404':
          description: Not found

  /edge/v1/identities/verify:
    post:
      operationId: verifyIdentity
      summary: Verify identity
      tags: [identity]
      x-usrp-session: officer
      x-usrp-permission: identity.verify
      x-usrp-outcomes: { 422: [NOT_A_CITIZEN] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      responses:
        '422':
          description: "NOT_A_CITIZEN"
        '200':
          description: Verified
        '404':
          description: Not found

  /edge/v1/gate/admissions:
    post:
      operationId: admitAtGate
      summary: |
        Admit a candidate at the venue gate and SPEND their exam QR (BUILD-003,
        ADR-034). The screening officer scans the QR and types the national ID
        from the candidate's card. identity-service hashes it (sole key holder);
        application-service decides under the officer's own credential, in one
        transaction: genuine stored ticket, not already used, admissible status,
        this venue, today (Africa/Kigali), card matches. Admission advances
        SLOT_ASSIGNED → PHYSICAL_TEST_SCHEDULED. Every scan is logged. Never
        retried by the edge.
      tags: [gate]
      x-usrp-session: officer
      x-usrp-permission: admission.gate
      x-usrp-outcomes: { 409: [ALREADY_ADMITTED, NOT_ADMISSIBLE, IDENTITY_MISMATCH, WRONG_VENUE, TOO_EARLY, EXPIRED], 422: [INVALID_TICKET] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [qrToken, nationalId, gateVenueName]
              properties:
                qrToken: { type: string, minLength: 1, maxLength: 4096, description: The QR text as scanned (USRP-SLOT.v1…) }
                nationalId: { type: string, pattern: '^[0-9]{16}$', description: From the physical card; hashed by identity-service, never stored or returned }
                gateVenueName: { type: string, minLength: 1, maxLength: 200, description: The venue this gate is at }
      responses:
        '200':
          description: "{ outcome: ADMITTED, candidate { applicationId, processingCode, category }, venueName, examDate, reportingTimeHour, admittedAt, statusAdvanced, identityMethod: NATIONAL_ID_CARD | NATIONAL_ID_CARD+CARD_PORTRAIT | NATIONAL_ID_CARD+SUPERVISOR } (identityMethod: ADR-037)"
        '400':
          description: INVALID_REQUEST — shape only (incl. a national ID that is not 16 digits)
        '403':
          description: PERMISSION_DENIED — only the screening post (admission.gate) admits
        '409':
          description: "ALREADY_ADMITTED (candidate, admittedAt, venueName, admittedBySelf) | NOT_ADMISSIBLE (candidate, currentStatus) | IDENTITY_MISMATCH (candidate) | MANUAL_IDENTITY_REQUIRED (candidate) — ADR-037 check 10, after the card matched; a field supervisor must confirm via confirmManualIdentity; never a refusal | WRONG_VENUE (ticketVenueName) | TOO_EARLY | EXPIRED (examDate)"
        '422':
          description: "INVALID_TICKET { reason: MALFORMED_TICKET | WRONG_AGENCY | UNKNOWN_TICKET | TICKET_NOT_ISSUED }"
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH — an off-contract answer is never relayed
        '503':
          description: UPSTREAM_UNAVAILABLE

  /edge/v1/gate/biometric-policy:
    get:
      operationId: getBiometricPolicy
      summary: |
        The biometric evidence policy in force for the officer's agency
        (ADR-037): mode (OFF | SHADOW | ADVISORY; there is no automatic mode),
        legal basis, threshold policy, reference-source status. The device reads
        it before capturing; in OFF it captures nothing, in SHADOW it must never
        display a result.
      tags: [gate]
      x-usrp-session: officer
      x-usrp-permission: biometric.verify
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: "{ agency, mode, legalBasis, evidenceSchema: USRP-BIO-EVIDENCE.v1, maxBodyBytes, thresholdPolicy { version, livenessPassBp, matchBp, noMatchBelowBp }, referenceSources [{ id: CARD_PORTRAIT | NIDA_PORTRAIT | NONE, status: DEVICE_ATTESTED | SERVER_MATCH | NOT_AUTHORISED | MANUAL_ONLY }] }"
        '403':
          description: PERMISSION_DENIED (biometric.verify, screening_officer)
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/gate/biometric-evidence:
    post:
      operationId: recordBiometricEvidence
      summary: |
        Record device-signed biometric identity EVIDENCE (ADR-037). The tablet
        matched the live face against the card portrait ON THE DEVICE; this
        carries only the signed outcome, integer scores, model and policy. No
        image, frame, template or embedding is accepted: the body is capped at
        4 KiB, must be exactly { record, signature }, and the record must be a
        flat object of scalars (arrays, nested objects, data: values and long
        strings are refused as IMAGE_PAYLOAD_REFUSED). The signature is Ed25519
        over canonicalJson(record), verified against the enrolled device of the
        officer's agency. A record id is stored once; the same record and
        signature again answers ALREADY_RECORDED. Never retried by the edge.
        Evidence never admits or refuses anyone by itself.
      tags: [gate]
      x-usrp-session: officer
      x-usrp-permission: biometric.verify
      x-usrp-outcomes: { 409: [REPLAY_CONFLICT, BIOMETRIC_OFF, MODE_MISMATCH], 422: [INVALID_EVIDENCE] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [record, signature]
              properties:
                record:
                  type: object
                  additionalProperties: false
                  description: USRP-BIO-EVIDENCE.v1; every key required (nullable ones as null); see ADR-037 §4
                  required: [schema, recordId, applicationId, ticketId, deviceId, keyId, referenceSource, method, consentState, outcome, notAttemptedReason, livenessScoreBp, matchScoreBp, modelId, modelVersion, thresholdPolicyVersion, mode, capturedAt]
                  properties:
                    schema: { type: string, enum: [USRP-BIO-EVIDENCE.v1] }
                    recordId: { type: string, format: uuid, description: Lowercase, generated on the device }
                    applicationId: { type: string, format: uuid }
                    ticketId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
                    deviceId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$' }
                    keyId: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the device public key SPKI DER }
                    referenceSource: { type: string, enum: [CARD_PORTRAIT, NIDA_PORTRAIT, NONE], description: NIDA_PORTRAIT is refused (not authorised) }
                    method: { type: string, enum: [FACE_1_1_ON_DEVICE, NONE] }
                    consentState: { type: string, enum: [GIVEN, DECLINED, NOT_REQUIRED_BY_POLICY] }
                    outcome: { type: string, enum: [MATCH, NO_MATCH, INCONCLUSIVE, NOT_ATTEMPTED] }
                    notAttemptedReason: { type: [string, 'null'], enum: [CANDIDATE_DECLINED, CAPTURE_FAILED, CARD_PORTRAIT_UNREADABLE, DEVICE_UNAVAILABLE, NO_REFERENCE_SOURCE, null] }
                    livenessScoreBp: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
                    matchScoreBp: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
                    modelId: { type: [string, 'null'], maxLength: 64 }
                    modelVersion: { type: [string, 'null'], maxLength: 32 }
                    thresholdPolicyVersion: { type: string, maxLength: 32 }
                    mode: { type: string, enum: [SHADOW, ADVISORY] }
                    capturedAt: { type: string, format: date-time }
                signature: { type: string, pattern: '^[A-Za-z0-9+/]{86}==$', description: Ed25519 over the UTF-8 bytes of canonicalJson(record), standard base64 }
      responses:
        '201':
          description: "{ status: RECORDED, recordId, mode, receivedAt, outcome (ADVISORY only; a SHADOW outcome is never shown) }"
        '200':
          description: "{ status: ALREADY_RECORDED, recordId, mode } (the same record and signature again)"
        '400':
          description: INVALID_REQUEST | FORBIDDEN_FIELD (e.g. agency, which comes from the session)
        '403':
          description: "UNTRUSTED_EVIDENCE { reason: UNKNOWN_DEVICE | DEVICE_WRONG_AGENCY | DEVICE_REVOKED | KEY_MISMATCH | SIGNATURE_INVALID } | PERMISSION_DENIED"
        '409':
          description: "REPLAY_CONFLICT | BIOMETRIC_OFF | MODE_MISMATCH { configuredMode }"
        '413':
          description: Body over 4 KiB
        '422':
          description: "INVALID_EVIDENCE { reason: IMAGE_PAYLOAD_REFUSED | SCHEMA_INVALID | THRESHOLD_POLICY_UNKNOWN | THRESHOLD_POLICY_NOT_IN_FORCE | OUTCOME_INCONSISTENT | CONSENT_STATE_NOT_PERMITTED | CAPTURED_AT_OUT_OF_RANGE | REFERENCE_SOURCE_NOT_AUTHORISED | UNKNOWN_TICKET }"
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH
        '503':
          description: UPSTREAM_UNAVAILABLE

  /edge/v1/gate/manual-identity:
    post:
      operationId: confirmManualIdentity
      summary: |
        Supervised manual identity after NO_MATCH or INCONCLUSIVE advisory
        evidence (ADR-037). A field supervisor (not the capturing officer, and
        not the officer who will admit) confirms with a closed reason code
        through their own session. The gate admission then records
        NATIONAL_ID_CARD+SUPERVISOR. Never retried by the edge.
      tags: [gate]
      x-usrp-session: officer
      x-usrp-permission: identity.manual.confirm
      x-usrp-outcomes: { 409: [NOT_REQUIRED, ALREADY_CONFIRMED, SAME_OFFICER] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recordId, reasonCode]
              properties:
                recordId: { type: string, format: uuid }
                reasonCode: { type: string, enum: [CARD_PHOTO_OUTDATED, APPEARANCE_CHANGED, POOR_CAPTURE_CONDITIONS, CARD_PORTRAIT_DAMAGED, SECONDARY_DOCUMENT_CHECKED, SUPERVISOR_INTERVIEW] }
      responses:
        '201':
          description: "{ status: CONFIRMED, confirmationId, recordId, confirmedAt }"
        '400':
          description: INVALID_REQUEST
        '403':
          description: PERMISSION_DENIED (identity.manual.confirm, field_supervisor)
        '404':
          description: NOT_FOUND (unknown, SHADOW or another agency's record; one answer)
        '409':
          description: "NOT_REQUIRED (MATCH / NOT_ATTEMPTED) | ALREADY_CONFIRMED | SAME_OFFICER"
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/applications/biometric-evidence:
    get:
      operationId: getBiometricEvidence
      summary: |
        ADVISORY biometric evidence for one application in the officer's agency
        (ADR-037), for the officer application detail. SHADOW evidence is
        invisible to every officer (engine RLS). Scores, outcome, method, model,
        policy and the supervisor's reason only; never a device id, key id,
        signature or officer id. `?applicationId=` is a query parameter.
      tags: [applications]
      x-usrp-session: officer
      x-usrp-permission: biometric.evidence.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - { name: applicationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "{ applicationId, evidence: [{ recordId, ticketId, referenceSource, method, consentState, outcome, notAttemptedReason, livenessScoreBp, matchScoreBp, modelId, modelVersion, thresholdPolicyVersion, mode: ADVISORY, capturedAt, receivedAt, manualIdentity { reasonCode, confirmedAt } | null }] }"
        '403':
          description: PERMISSION_DENIED (biometric.evidence.read)
        '404':
          description: NOT_FOUND (nonexistent and another agency's are one answer)
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/me/applications:
    get:
      operationId: listMyApplications
      summary: List my applications
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: My applications
        '401':
          description: Unauthorized
    post:
      operationId: submitMyApplication
      summary: |
        Submit my application. The subject is the applicant session; agency is
        derived from the category server-side. The request must carry exactly
        one UUID `Idempotency-Key` header — the citizen's retry identity — and
        a retry with the same key and body replays the first answer (200 with
        `Idempotency-Replayed: true`, exposed to scripts by CORS) instead of
        filing again. NOT retried by this tier: the key, not a hidden proxy
        retry, is what makes the browser's own retry safe.
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              additionalProperties: false
              properties:
                category:
                  type: string
                  description: A real application category; the agency is derived from it server-side.
                nesaIndexNumber:
                  type: string
                  maxLength: 64
                  description: A-Level NESA index number, when the category's academic path is NESA.
                hecRegistrationNumber:
                  type: string
                  maxLength: 64
                  description: HEC registration number, when the category's academic path is HEC.
            examples:
              submit:
                value:
                  category: GENERAL_ENLISTMENT
                  nesaIndexNumber: 'RW2026/1001'
      responses:
        '201':
          description: Filed — the first submission under this key.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum: ['true']
              description: Absent on a first submission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [SUBMITTED]
                  applicationId:
                    type: string
                    format: uuid
                  processingCode:
                    type: string
                  agency:
                    type: string
        '200':
          description: |
            Replay — the same key and body were already answered; the first
            submission's identifiers are returned again, with
            Idempotency-Replayed: true.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum: ['true']
        '400':
          description: Invalid request (bad key, unknown category, forbidden identity/channel field).
        '401':
          description: No applicant session.
        '409':
          description: |
            ALREADY_APPLIED (a live application for this campaign+category
            already exists, with its identifiers so the citizen can be pointed
            at it), or a business conflict (IDENTITY_NOT_VERIFIED,
            NO_OPEN_CAMPAIGN).
        '422':
          description: |
            KEY_REUSED (the key was spent on a materially different request —
            no application identifiers are returned), or an academic-input
            validation failure with its reason.
        '429':
          description: The applicant-session submission rate limit was exceeded.
        '503':
          description: Dependency failure (fail closed).

  /edge/v1/me/applications/exam-invitation:
    get:
      operationId: getMyExamInvitation
      summary: The citizen's exam QR — the signed slot invitation to download and present at the physical screening (ADR-033)
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - { name: applicationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "{ state, agency, processingCode, campaignLabel, currentStatus, invitation?, admission? } — invitation only when state is READY (slot assigned, not expired, not on hold, not yet used); admission { venueName, admittedAt } only when state is ADMITTED (the QR was spent at the gate, ADR-034, and is never re-sent)"
        '404':
          description: Not this citizen's application
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH — a malformed payload is never relayed
  /edge/v1/me/applications/document-checklist:
    get:
      operationId: getMyDocumentChecklist
      summary: The citizen's advisory document checklist for one of their applications (ADR-032)
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - { name: applicationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: "{ agency, source, complete, items: [{ documentType, satisfaction, registry }] } — advisory, never a gate"
        '404':
          description: Not this citizen's application (same answer as nonexistent)
  /edge/v1/applications/document-checklist:
    get:
      operationId: getDocumentChecklist
      summary: Advisory document checklist for an application of the officer's agency (ADR-032)
      tags: [officer]
      x-usrp-session: officer
      x-usrp-permission: application.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - { name: applicationId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The checklist
        '403':
          description: PERMISSION_DENIED (needs application.read)
        '404':
          description: Not in the officer's agency
  /edge/v1/applications/documents/verify-at-venue:
    post:
      operationId: verifyDocumentAtVenue
      summary: The check-in officer records seeing a required document's paper at the venue (ADR-032)
      tags: [officer]
      x-usrp-session: officer
      x-usrp-permission: document.verify.venue
      x-usrp-outcomes: { 409: [NOT_APPLICABLE], 422: [UNSUPPORTED_DOCUMENT_TYPE, NOT_REQUIRED] }
      x-usrp-csrf: true
      responses:
        '200':
          description: RECORDED or ALREADY_RECORDED (idempotent), with the updated checklist
        '403':
          description: PERMISSION_DENIED (needs document.verify.venue — the check-in post)
        '404':
          description: Not in the officer's agency
        '409':
          description: NOT_APPLICABLE — the application is terminal
        '422':
          description: NOT_REQUIRED — the type is not on this application's list
  /edge/v1/me/applications/documents:
    post:
      operationId: uploadMyDocument
      summary: Upload a required document for the citizen's own application
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [applicationId, documentType, file]
              properties:
                applicationId: { type: string, format: uuid }
                documentType: { type: string }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored; only { documentId, documentType } is returned (never a verdict)
        '404':
          description: No such application for this citizen
        '409':
          description: The application is not accepting documents
        '422':
          description: Unsupported, mislabelled or infected file
        '503':
          description: A dependency is unavailable
  /edge/v1/me/applications/withdraw:
    post:
      operationId: withdrawMyApplication
      summary: Withdraw application
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: true
      responses:
        '200':
          description: Withdrawn
        '404':
          description: Not found

  /edge/v1/me/erasure-request:
    get:
      operationId: getMyErasureRequest
      summary: Get erasure request status
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: Erasure request status
        '401':
          description: Unauthorized
    post:
      operationId: fileMyErasureRequest
      summary: File erasure request
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: true
      responses:
        '201':
          description: Filed
        '409':
          description: Already filed

  /edge/v1/field-sync/devices:
    post:
      operationId: enrollFieldDevice
      summary: Enroll device
      tags: [field-sync]
      x-usrp-session: officer
      x-usrp-permission: field.device.enroll
      x-usrp-outcomes: {}
      x-usrp-csrf: true
      responses:
        '201':
          description: Enrolled
        '400':
          description: Invalid

  /edge/v1/field-sync/scores:
    post:
      operationId: syncFieldScores
      summary: Sync scores
      tags: [field-sync]
      x-usrp-session: officer
      x-usrp-permission: field.score.sync
      x-usrp-outcomes: {}
      x-usrp-csrf: true
      responses:
        '200':
          description: Synced
        '400':
          description: Malformed

  /edge/v1/field-sync/conflicts/resolve:
    post:
      operationId: resolveFieldSyncConflict
      summary: Resolve conflict
      tags: [field-sync]
      x-usrp-session: officer
      x-usrp-permission: field.conflict.resolve
      x-usrp-outcomes: { 409: [NO_CONFLICT] }
      x-usrp-csrf: true
      responses:
        '409':
          description: "NO_CONFLICT (nothing to adjudicate)"
        '200':
          description: Resolved
        '404':
          description: Not found

  /edge/v1/officers:
    get:
      operationId: listOfficers
      x-usrp-session: officer
      x-usrp-permission: officer.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      summary: |
        List the officers of the session's own agency (ADR-036). agency_admin
        only (officer.read). Never a credential, activation code or code hash.
      tags: [officer-admin]
      responses:
        '200':
          description: "{ officers: [ { officerId, loginHandle, posts[], status: active|disabled|pending, createdAt, activatedAt|null, lastLoginAt|null, activationExpiresAt|null } ] }"
        '401':
          description: Session ended ({ reason })
        '403':
          description: PERMISSION_DENIED — not an active agency administrator
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH
    post:
      operationId: createOfficer
      x-usrp-session: officer
      x-usrp-permission: officer.create
      x-usrp-outcomes: { 409: [HANDLE_TAKEN], 422: [INVALID_HANDLE, INVALID_POSTS, UNKNOWN_POST] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      summary: |
        Create an officer in the session's own agency with initial posts
        (officer.create). The account is `pending` until the officer redeems
        the ONE-TIME activation code returned here exactly once (stored only
        as a hash; 24 h; single use). agency_admin is not an assignable post.
        Never retried: a lost answer is recovered with reissueOfficerActivation.
      tags: [officer-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [loginHandle, posts]
              properties:
                loginHandle: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,63}$', description: Unique platform-wide; normalised to lower case }
                posts:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items: { type: string, enum: [reviewer, screening_officer, field_supervisor, medical_officer, adjudicator, decision_authority, dpo] }
      responses:
        '201':
          description: "{ outcome: CREATED, officer { …as listOfficers }, activation { code: XXXXX-XXXXX-XXXXX-XXXXX, expiresAt } } — show the code once"
        '400':
          description: INVALID_REQUEST — shape only
        '403':
          description: PERMISSION_DENIED | AGENCY_ADMIN_NOT_ASSIGNABLE
        '409':
          description: HANDLE_TAKEN
        '422':
          description: INVALID_HANDLE | INVALID_POSTS | UNKNOWN_POST

  /edge/v1/officers/activation/reissue:
    post:
      operationId: reissueOfficerActivation
      x-usrp-session: officer
      x-usrp-permission: officer.create
      x-usrp-outcomes: { 409: [NOT_PENDING_ACTIVATION] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      summary: |
        Replace the activation code of an officer who has never activated
        (lost or expired code). Never a password reset (officer.create).
      tags: [officer-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetOfficerId]
              properties:
                targetOfficerId: { type: string, format: uuid }
      responses:
        '200':
          description: "{ outcome: REISSUED, officer, activation { code, expiresAt } }"
        '403':
          description: PERMISSION_DENIED | SELF_MODIFICATION
        '404':
          description: NOT_FOUND — absent or in another agency (one answer)
        '409':
          description: NOT_PENDING_ACTIVATION

  /edge/v1/officers/posts:
    post:
      operationId: assignOfficerPosts
      x-usrp-session: officer
      x-usrp-permission: officer.posts.assign
      x-usrp-outcomes: { 422: [INVALID_POSTS, UNKNOWN_POST, INVALID_REASON] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      summary: |
        Replace an officer's posts (officer.posts.assign), with a closed reason
        code. agency_admin can never be added and an existing one is kept. A
        change ends every edge session of that officer now (POSTS_CHANGED);
        their next request re-authenticates and carries the new posts.
      tags: [officer-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetOfficerId, posts, reasonCode]
              properties:
                targetOfficerId: { type: string, format: uuid }
                posts:
                  type: array
                  minItems: 1
                  maxItems: 7
                  uniqueItems: true
                  items: { type: string, enum: [reviewer, screening_officer, field_supervisor, medical_officer, adjudicator, decision_authority, dpo] }
                reasonCode: { type: string, enum: [POSTING_CHANGE, CORRECTION, TEMPORARY_COVER, OTHER] }
      responses:
        '200':
          description: "{ outcome: ASSIGNED|UNCHANGED, officer, sessionsRevoked }"
        '403':
          description: PERMISSION_DENIED | SELF_MODIFICATION | AGENCY_ADMIN_NOT_ASSIGNABLE
        '404':
          description: NOT_FOUND
        '422':
          description: INVALID_POSTS | UNKNOWN_POST | INVALID_REASON

  /edge/v1/officers/disable:
    post:
      operationId: disableOfficer
      x-usrp-session: officer
      x-usrp-permission: officer.disable
      x-usrp-outcomes: { 409: [LAST_ACTIVE_ADMIN], 422: [INVALID_REASON] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      summary: |
        Disable an officer (officer.disable). Login is refused from now on and
        every edge session of that officer ends in the same transaction
        (ACCOUNT_DISABLED): an already-open browser is told 401 revoked on its
        next request. The last active agency_admin cannot be disabled.
      tags: [officer-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetOfficerId, reasonCode]
              properties:
                targetOfficerId: { type: string, format: uuid }
                reasonCode: { type: string, enum: [LEFT_SERVICE, SUSPENDED, SECURITY_CONCERN, EXTENDED_LEAVE, OTHER] }
      responses:
        '200':
          description: "{ outcome: DISABLED|UNCHANGED, officer, sessionsRevoked }"
        '403':
          description: PERMISSION_DENIED | SELF_MODIFICATION
        '404':
          description: NOT_FOUND
        '409':
          description: LAST_ACTIVE_ADMIN
        '422':
          description: INVALID_REASON

  /edge/v1/officers/enable:
    post:
      operationId: enableOfficer
      x-usrp-session: officer
      x-usrp-permission: officer.disable
      x-usrp-outcomes: { 422: [INVALID_REASON] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      summary: Re-enable a disabled officer (officer.disable). A never-activated account returns to pending.
      tags: [officer-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetOfficerId, reasonCode]
              properties:
                targetOfficerId: { type: string, format: uuid }
                reasonCode: { type: string, enum: [RETURNED_TO_DUTY, SUSPENSION_LIFTED, CORRECTION, OTHER] }
      responses:
        '200':
          description: "{ outcome: ENABLED|UNCHANGED, officer, sessionsRevoked: 0 }"
        '403':
          description: PERMISSION_DENIED | SELF_MODIFICATION
        '404':
          description: NOT_FOUND
        '422':
          description: INVALID_REASON

  /edge/v1/officers/sessions/revoke:
    post:
      operationId: revokeOfficerSessions
      x-usrp-session: officer
      x-usrp-permission: officer.sessions.revoke
      x-usrp-outcomes: { 422: [INVALID_REASON] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      summary: End every browser session of an officer now (officer.sessions.revoke; SESSIONS_REVOKED). The account stays active.
      tags: [officer-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetOfficerId, reasonCode]
              properties:
                targetOfficerId: { type: string, format: uuid }
                reasonCode: { type: string, enum: [DEVICE_LOST, SECURITY_CONCERN, OTHER] }
      responses:
        '200':
          description: "{ outcome: REVOKED, officer, sessionsRevoked }"
        '403':
          description: PERMISSION_DENIED | SELF_MODIFICATION
        '404':
          description: NOT_FOUND
        '422':
          description: INVALID_REASON

  /edge/v1/auth/officer/activate:
    post:
      operationId: activateOfficer
      x-usrp-session: anonymous
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      summary: |
        The officer redeems their one-time activation code and sets their own
        password (12–256 characters). Then they sign in with officerLogin.
        Rate-limited per handle and per client.
      tags: [officer-auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [loginHandle, activationCode, password]
              properties:
                loginHandle: { type: string, maxLength: 64 }
                activationCode: { type: string, maxLength: 64, description: XXXXX-XXXXX-XXXXX-XXXXX; case and dashes optional }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        '204':
          description: Activated
        '400':
          description: WEAK_PASSWORD (or INVALID_REQUEST for shape)
        '401':
          description: ACTIVATION_REJECTED — one answer for unknown handle, wrong/expired/used code, or an account that is not pending
        '429':
          description: Rate limited

  /edge/health:
    get:
      operationId: edgeHealth
      summary: Health check
      tags: [probes]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      responses:
        '200':
          description: Healthy

  /edge/ready:
    get:
      operationId: edgeReady
      summary: Readiness check
      tags: [probes]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready

  # ── ADR-039 operational read models ────────────────────────────
  /edge/v1/campaigns/admin:
    get:
      operationId: listAgencyCampaigns
      x-usrp-session: officer
      x-usrp-permission: campaign.read.admin
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      summary: |
        The session agency's campaigns in EVERY state (the public list shows only
        open ones), newest first, with a keyset cursor and a total. Each row
        carries a session occupancy roll-up (ADR-026 registered_count against
        capacity_limit). No internal id; the agency is the session's.
      tags: [campaign-admin]
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 64 }, description: "Case-insensitive substring of the label or public code." }
        - { name: status, in: query, required: false, schema: { type: array, items: { type: string, enum: [DRAFT, REGISTRATION_OPEN, REGISTRATION_CLOSED, EXAMINATION_ACTIVE, COMPLETED, CANCELLED] } }, style: form, explode: true, description: "Repeatable, or comma-separated." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 }, description: "The previous page's nextCursor. Opaque." }
      responses:
        '200':
          description: "{ agency, campaigns: [ { publicCode, campaignLabel, status, targetCategories[], targetDistricts[], registrationOpensAt, registrationClosesAt, examinationStartDate, examinationEndDate, allowsWalkIn, targetIntakeCount|null, publishedAt|null, createdAt, occupancy: { sessionCount, capacityTotal|null, hasUnboundedSession, registeredTotal } } ], total, nextCursor|null }"
        '400':
          description: INVALID_REQUEST (unknown query key, bad status, bad cursor)
        '401':
          description: Session ended ({ reason })
        '403':
          description: PERMISSION_DENIED
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/campaigns/admin/detail:
    get:
      operationId: getCampaignAdminDetail
      x-usrp-session: officer
      x-usrp-permission: campaign.read.admin
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      summary: |
        One of the session agency's campaigns with its sessions and occupancy
        (capacityLimit, registeredCount, remaining; an unbounded session says so
        with its decision code), the current policy version and hash, the
        coverage version and hash, and the lifecycle history. A sibling agency's
        campaign and a nonexistent one are the same bare 404.
      tags: [campaign-admin]
      parameters:
        - { name: publicCode, in: query, required: true, schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{2,63}$' } }
      responses:
        '200':
          description: "{ agency, campaign: { ...the list row, contactPhoneNumbers|null, contactWebsite|null, announcementReference|null, registrationClosedAt|null, cancelledAt|null, policy: { versionNumber, policyHash, hashVersion, legalBasisCode, createdAt }|null, coverage: { version, hash }|null, sessions: [ { district, province, venueName, examDate, reportingTimeHour, capacityLimit|null, capacityDecisionCode|null, registeredCount, remaining|null, isActive } ], history: [ { fromStatus|null, toStatus, reasonCode|null, occurredAt } ] } }"
        '400':
          description: INVALID_PUBLIC_CODE
        '401':
          description: Session ended ({ reason })
        '403':
          description: PERMISSION_DENIED
        '404':
          description: NOT_FOUND (also for a sibling agency's campaign)
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/applications/search:
    get:
      operationId: searchApplications
      x-usrp-session: officer
      x-usrp-permission: application.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      summary: |
        The paginated, filterable officer application list (v2 of listApplications,
        which keeps its capped v1 shape). Newest first, keyset cursor over
        (submitted_at, id), `total` for the filters ignoring the cursor. A filter
        that matches nothing is 200 with total 0. Non-PII rows only.
      tags: [applications]
      parameters:
        - { name: status, in: query, required: false, schema: { type: array, items: { type: string } }, style: form, explode: true, description: "Application statuses; repeatable, or comma-separated." }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: campaign, in: query, required: false, schema: { type: string }, description: "Campaign public code (the session agency's own)." }
        - { name: district, in: query, required: false, schema: { type: string }, description: "Assigned exam district." }
        - { name: submittedFrom, in: query, required: false, schema: { type: string, format: date }, description: "Inclusive Kigali calendar day." }
        - { name: submittedTo, in: query, required: false, schema: { type: string, format: date }, description: "Inclusive Kigali calendar day." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: "{ agency, applications: [ { applicationId, processingCode, category, status, submittedAt|null } ], total, nextCursor|null }"
        '400':
          description: INVALID_REQUEST
        '401':
          description: Session ended ({ reason })
        '403':
          description: PERMISSION_DENIED
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/gate/roster:
    get:
      operationId: getVenueRoster
      x-usrp-session: officer
      x-usrp-permission: admission.gate
      x-usrp-permission-also: [field.score.sync]
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      summary: |
        The minimum candidate set for one venue day (ADR-039): processing code,
        category, status, admission state (ADMITTED | NOT_ADMITTED) and the paper
        items the candidate is asked to present. NO name, NO National ID, no
        applicant id, no QR token, no phone. The same shape feeds the field
        ledger's pre-download manifest. Any one of the two permissions admits.
      tags: [gate]
      parameters:
        - { name: campaign, in: query, required: true, schema: { type: string }, description: "Campaign public code." }
        - { name: district, in: query, required: true, schema: { type: string } }
        - { name: examDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: "{ agency, venue: { venueName, district, examDate, reportingTimeHour, capacityLimit|null, registeredCount }, candidates: [ { processingCode, category, status, admission, requiredPaperItems[] } ], truncated }"
        '400':
          description: INVALID_REQUEST
        '401':
          description: Session ended ({ reason })
        '403':
          description: PERMISSION_DENIED
        '404':
          description: NOT_FOUND (no such venue day in this agency; identical for a sibling agency's campaign)
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/erasure-requests:
    get:
      operationId: listErasureRequests
      x-usrp-session: officer
      x-usrp-permission: erasure.queue.read
      x-usrp-outcomes: {}
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      summary: |
        The data-protection office's queue of PENDING erasure requests (ADR-020).
        A request is identified by its id and age only; the applicant id never
        crosses the edge.
      tags: [compliance]
      responses:
        '200':
          description: "{ requests: [ { requestId, requestedAt } ] }"
        '401':
          description: Session ended ({ reason })
        '403':
          description: PERMISSION_DENIED
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

  /edge/v1/erasure-requests/decision:
    post:
      operationId: decideErasureRequest
      x-usrp-session: officer
      x-usrp-permission: erasure.decide
      x-usrp-outcomes: { 409: [NOT_PENDING, REFUSED_ACTIVE_APPLICATION, REFUSED_ACCEPT_LOCKED] }
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      x-usrp-composition: composed
      summary: |
        The DPO's decision on one pending request. DECLINE needs written grounds
        (the citizen is shown them). EXECUTE runs the existing gated erasure road
        (ADR-015) for that request's applicant, resolved server-side; it is
        irreversible and refused while the applicant holds an active application.
        Never retried by the edge.
      tags: [compliance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, decision]
              properties:
                requestId: { type: string, format: uuid }
                decision: { type: string, enum: [DECLINE, EXECUTE] }
                grounds: { type: string, minLength: 1, maxLength: 200, description: "Required for DECLINE; refused for EXECUTE." }
      responses:
        '200':
          description: "{ requestId, decision: DECLINED | EXECUTED }"
        '400':
          description: INVALID_REQUEST | GROUNDS_REQUIRED
        '401':
          description: Session ended ({ reason })
        '403':
          description: PERMISSION_DENIED
        '404':
          description: NOT_FOUND (unknown, or no longer pending, for EXECUTE)
        '409':
          description: NOT_PENDING | REFUSED_ACTIVE_APPLICATION | REFUSED_ACCEPT_LOCKED
        '502':
          description: UPSTREAM_CONTRACT_MISMATCH

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID key required for each campaign write; same actor, operation, key, and request body replay the original result.
      schema:
        type: string
        format: uuid

tags:
  - name: session
    description: Session management
  - name: officer-auth
    description: Officer authentication
  - name: applicant-auth
    description: Applicant authentication
  - name: campaign-control
    description: Officer-authorized campaign lifecycle and session configuration
  - name: public-campaigns
    description: Safe published campaign catalogue and detail
  - name: officer-reads
    description: Officer reads
  - name: officer-transitions
    description: Officer transitions
  - name: walk-in
    description: Walk-in registration
  - name: identity
    description: Identity verification
  - name: citizen
    description: Citizen self-service
  - name: field-sync
    description: Field sync
  - name: probes
    description: Health probes
  - name: campaign-admin
    description: Agency-scoped campaign administration reads (ADR-039)
  - name: compliance
    description: Data-protection office queue and decisions (ADR-039)
  - name: officer-admin
    description: Officer lifecycle — agency administrators over their own agency's officers (ADR-036)
