openapi: 3.1.0
info:
  title: e-recruitment Edge Gateway
  description: |
    The EDGE RUNTIME CONTRACT — the single trusted browser boundary.
    
    All 36 operations mount under `/edge/v1/**`. The browser never calls service
    ports directly, never holds upstream credentials, and never declares agency:
    the edge serves opaque session cookies and derives agency from the verified
    officer session.
    
    This document is maintained alongside the operation registry
    (services/edge-gateway/src/domain/edge-operations.ts). The required
    selfcheck/verify-edge-contract.ts compares the mounted routes, registry,
    public allowlist, upstream catalogue, and OpenAPI operation IDs.
  version: "2026-09-13"
  contact:
    name: Backend Architecture
    email: backend-arch@example.com
servers:
  - url: https://recruitment.example.com
    description: Production edge gateway
  - url: http://localhost:3000
    description: Local development (insecure, testing only)

paths:
  /edge/v1/session:
    get:
      operationId: readSession
      summary: Read the current session
      tags: [session]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      responses:
        '200':
          description: Session state
        '401':
          description: No session

  /edge/v1/session/refresh:
    post:
      operationId: refreshSession
      summary: Refresh the session handle and CSRF token
      tags: [session]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      responses:
        '200':
          description: New session
        '403':
          description: CSRF invalid

  /edge/v1/auth/officer/login:
    post:
      operationId: officerLogin
      summary: Officer login
      tags: [officer-auth]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited

  /edge/v1/auth/officer/logout:
    post:
      operationId: officerLogout
      summary: Officer logout
      tags: [officer-auth]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-idempotent-without-session: true
      responses:
        '204':
          description: Logged out
        '403':
          description: CSRF invalid

  /edge/v1/auth/applicant/otp/request:
    post:
      operationId: requestApplicantOtp
      summary: Request OTP
      tags: [applicant-auth]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: true
      responses:
        '202':
          description: OTP request accepted
        '429':
          description: Rate limited

  /edge/v1/auth/applicant/otp/verify:
    post:
      operationId: verifyApplicantOtp
      summary: Verify OTP
      tags: [applicant-auth]
      x-usrp-session: anonymous
      x-usrp-csrf: true
      responses:
        '200':
          description: Verified
        '401':
          description: Invalid OTP

  /edge/v1/auth/applicant/logout:
    post:
      operationId: logoutApplicant
      summary: Applicant logout
      tags: [applicant-auth]
      x-usrp-session: applicant
      x-usrp-csrf: true
      x-usrp-idempotent-without-session: true
      responses:
        '204':
          description: Logged out
        '403':
          description: CSRF invalid

  /edge/v1/campaigns:
    post:
      operationId: createCampaign
      summary: Create a campaign draft
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode, campaignLabel, targetCategories, targetDistricts, registrationOpensAt, registrationClosesAt, examinationStartDate, examinationEndDate, examinationReportingHour, allowsWalkIn]
              properties:
                publicCode: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Z0-9][A-Z0-9-]*$' }
                campaignLabel: { type: string, minLength: 1, maxLength: 50 }
                targetCategories: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
                targetDistricts: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
                registrationOpensAt: { type: string, format: date-time }
                registrationClosesAt: { type: string, format: date-time }
                examinationStartDate: { type: string, format: date }
                examinationEndDate: { type: string, format: date }
                examinationReportingHour: { type: integer, minimum: 0, maximum: 23 }
                allowsWalkIn: { type: boolean }
                targetIntakeCount: { type: [integer, 'null'], minimum: 1 }
                contactPhoneNumbers: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
                contactWebsite: { type: [string, 'null'], maxLength: 100, format: uri }
      responses:
        '201': { description: Draft created; replay returns the stored original body. }
        '400': { description: Invalid draft or idempotency key. }
        '403': { description: Officer lacks campaign.create permission. }
        '409': { description: Public code or campaign label conflict. }
        '422': { description: Category, agency, or campaign-window validation failed. }
        '503': { description: Campaign persistence unavailable. }
    get:
      operationId: listCampaigns
      summary: List open published campaigns
      tags: [public-campaigns]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200': { description: Only REGISTRATION_OPEN campaigns with the safe public projection. }
        '503': { description: Public campaign read unavailable. }

  /edge/v1/campaigns/policy:
    post:
      operationId: createCampaignPolicy
      summary: Create an immutable policy version
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode, policyDocument, legalBasisCode, legalBasisReference]
              properties:
                publicCode: { type: string }
                policyDocument:
                  type: object
                  minProperties: 1
                  description: One complete policy entry per target category; official values are supplied by the authorized officer, not defaulted by this API.
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    required: [age, education, criminalThreshold, requiredDocumentTypes, medicalMode, legalBasis]
                    properties:
                      age:
                        type: object
                        additionalProperties: false
                        required: [minimumAge, maximumAge, referenceDate]
                        properties:
                          minimumAge: { type: integer, minimum: 0, maximum: 130 }
                          maximumAge: { type: integer, minimum: 0, maximum: 130 }
                          referenceDate: { type: string, format: date }
                      education:
                        type: object
                        additionalProperties: false
                        required: [mode, threshold]
                        properties:
                          mode: { type: string }
                          threshold: { oneOf: [{ type: string }, { type: number }] }
                      criminalThreshold: { type: string }
                      requiredDocumentTypes: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
                      medicalMode: { type: string }
                      legalBasis:
                        type: object
                        additionalProperties: false
                        required: [code, reference]
                        properties:
                          code: { type: string }
                          reference: { type: string, maxLength: 256 }
                legalBasisCode: { type: string }
                legalBasisReference: { type: string, maxLength: 256 }
      responses:
        '201': { description: Immutable policy version created; response includes its canonical SHA-256 hash. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.policy.create permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Policy cannot be amended in the current campaign state. }
        '422': { description: Policy shape or target-category coverage is invalid. }

  /edge/v1/campaigns/session:
    post:
      operationId: configureCampaignSession
      summary: Configure one scheduling-owned district session
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode, district, province, venueName, examDate, reportingTimeHour, capacityLimit, isActive]
              properties:
                publicCode: { type: string }
                district: { type: string }
                province: { type: string }
                venueName: { type: string, minLength: 1, maxLength: 200 }
                examDate: { type: string, format: date }
                reportingTimeHour: { type: integer, minimum: 0, maximum: 23 }
                capacityLimit: { type: [integer, 'null'], minimum: 1 }
                # Required as UNBOUNDED_CAPACITY when capacityLimit is null; ignored only when absent for finite capacity.
                capacityDecisionCode: { type: string, enum: [UNBOUNDED_CAPACITY] }
                isActive: { type: boolean }
      responses:
        '200': { description: Session configured or identical request replayed; includes coverage version/hash for officers. }
        '400': { description: Invalid session shape or idempotency key. }
        '403': { description: Officer lacks campaign.session.configure permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: State, reserved-session, idempotency, or coverage conflict. }
        '422': { description: District or exam-date configuration is invalid. }

  /edge/v1/campaigns/publish:
    post:
      operationId: publishCampaign
      summary: Publish a validated draft and open registration
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Published; policy version and exact coverage evidence are stored. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.publish permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid state, missing policy, incomplete coverage, or invalid capacity. }
        '422': { description: Policy/coverage hash or capacity validation failed. }

  /edge/v1/campaigns/registration-close:
    post:
      operationId: closeCampaignRegistration
      summary: Close campaign registration
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Registration closed. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.registration.close permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid lifecycle transition. }

  /edge/v1/campaigns/complete:
    post:
      operationId: completeCampaign
      summary: Complete a campaign after registration closes
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Campaign completed after registration closure. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.complete permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid lifecycle transition. }

  /edge/v1/campaigns/cancel:
    post:
      operationId: cancelCampaign
      summary: Cancel a permitted campaign
      tags: [campaign-control]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicCode]
              properties:
                publicCode: { type: string }
      responses:
        '200': { description: Campaign cancelled where the lifecycle and application-count rules permit it. }
        '400': { description: Invalid request or idempotency key. }
        '403': { description: Officer lacks campaign.cancel permission. }
        '404': { description: Campaign not found in the officer's agency. }
        '409': { description: Invalid lifecycle transition or applications prevent cancellation. }

  /edge/v1/campaigns/detail:
    get:
      operationId: getCampaignDetail
      summary: Read an externally published campaign by public code
      tags: [public-campaigns]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - name: publicCode
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 64 }
      responses:
        '200': { description: Public projection only; internal UUIDs, policies, coverage, capacity, registrations, and audit facts are omitted. }
        '400': { description: Invalid or missing publicCode. }
        '404': { description: Campaign is not externally published or does not exist. }
        '503': { description: Public campaign read unavailable. }

  /edge/v1/applications:
    get:
      operationId: listApplications
      summary: List applications
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: Applications list
        '401':
          description: Unauthorized

  /edge/v1/applications/amber-queue:
    get:
      operationId: listAmberQueue
      summary: List amber queue
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: Amber queue
        '401':
          description: Unauthorized

  /edge/v1/applications/by-id:
    get:
      operationId: findApplicationById
      summary: Find application by ID
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application found
        '404':
          description: Not found

  /edge/v1/applications/detail:
    get:
      operationId: getApplicationDetail
      summary: Get application with history
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      x-usrp-composition: composed
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application with history
        '404':
          description: Not found

  /edge/v1/applications/status-history:
    get:
      operationId: getApplicationStatusHistory
      summary: Get status history
      tags: [officer-reads]
      x-usrp-session: officer
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status history
        '404':
          description: Not found

  /edge/v1/applications/medical-review:
    post:
      operationId: recordMedicalReview
      summary: Record medical review
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '200':
          description: Recorded
        '409':
          description: Conflict

  /edge/v1/applications/final-decision:
    post:
      operationId: recordFinalDecision
      summary: Record final decision
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '200':
          description: Recorded
        '409':
          description: Conflict

  /edge/v1/applications/accept:
    post:
      operationId: acceptApplication
      summary: Accept application
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '200':
          description: Accepted
        '409':
          description: Conflict

  /edge/v1/applications/adjudicate:
    post:
      operationId: adjudicateApplication
      summary: Adjudicate application
      tags: [officer-transitions]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '200':
          description: Adjudicated
        '409':
          description: Conflict

  /edge/v1/applications/walk-in/register:
    post:
      operationId: registerWalkIn
      summary: Register walk-in
      tags: [walk-in]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '201':
          description: Registered
        '403':
          description: Forbidden for this agency
        '409':
          description: >-
            ALREADY_APPLIED (ADR-027) — this candidate already holds a live
            application for the campaign and category. Carries applicationId
            and processingCode so the tablet can open the existing record
            instead of creating a second one.

  /edge/v1/applications/walk-in/vet:
    post:
      operationId: vetWalkIn
      summary: Vet walk-in
      tags: [walk-in]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '200':
          description: Vetted
        '404':
          description: Not found

  /edge/v1/identities/verify:
    post:
      operationId: verifyIdentity
      summary: Verify identity
      tags: [identity]
      x-usrp-session: officer
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      responses:
        '200':
          description: Verified
        '404':
          description: Not found

  /edge/v1/me/applications:
    get:
      operationId: listMyApplications
      summary: List my applications
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: My applications
        '401':
          description: Unauthorized
    post:
      operationId: submitMyApplication
      summary: |
        Submit my application. The subject is the applicant session; agency is
        derived from the category server-side. The request must carry exactly
        one UUID `Idempotency-Key` header — the citizen's retry identity — and
        a retry with the same key and body replays the first answer (200 with
        `Idempotency-Replayed: true`, exposed to scripts by CORS) instead of
        filing again. NOT retried by this tier: the key, not a hidden proxy
        retry, is what makes the browser's own retry safe.
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: true
      x-usrp-retry-on-g2g: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              additionalProperties: false
              properties:
                category:
                  type: string
                  description: A real application category; the agency is derived from it server-side.
                nesaIndexNumber:
                  type: string
                  maxLength: 64
                  description: A-Level NESA index number, when the category's academic path is NESA.
                hecRegistrationNumber:
                  type: string
                  maxLength: 64
                  description: HEC registration number, when the category's academic path is HEC.
            examples:
              submit:
                value:
                  category: GENERAL_ENLISTMENT
                  nesaIndexNumber: 'RW2026/1001'
      responses:
        '201':
          description: Filed — the first submission under this key.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum: ['true']
              description: Absent on a first submission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [SUBMITTED]
                  applicationId:
                    type: string
                    format: uuid
                  processingCode:
                    type: string
                  agency:
                    type: string
        '200':
          description: |
            Replay — the same key and body were already answered; the first
            submission's identifiers are returned again, with
            Idempotency-Replayed: true.
          headers:
            Idempotency-Replayed:
              schema:
                type: string
                enum: ['true']
        '400':
          description: Invalid request (bad key, unknown category, forbidden identity/channel field).
        '401':
          description: No applicant session.
        '409':
          description: |
            ALREADY_APPLIED (a live application for this campaign+category
            already exists, with its identifiers so the citizen can be pointed
            at it), or a business conflict (IDENTITY_NOT_VERIFIED,
            NO_OPEN_CAMPAIGN).
        '422':
          description: |
            KEY_REUSED (the key was spent on a materially different request —
            no application identifiers are returned), or an academic-input
            validation failure with its reason.
        '429':
          description: The applicant-session submission rate limit was exceeded.
        '503':
          description: Dependency failure (fail closed).

  /edge/v1/me/applications/withdraw:
    post:
      operationId: withdrawMyApplication
      summary: Withdraw application
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: true
      responses:
        '200':
          description: Withdrawn
        '404':
          description: Not found

  /edge/v1/me/erasure-request:
    get:
      operationId: getMyErasureRequest
      summary: Get erasure request status
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: false
      x-usrp-retry-on-g2g: true
      responses:
        '200':
          description: Erasure request status
        '401':
          description: Unauthorized
    post:
      operationId: fileMyErasureRequest
      summary: File erasure request
      tags: [citizen]
      x-usrp-session: applicant
      x-usrp-csrf: true
      responses:
        '201':
          description: Filed
        '409':
          description: Already filed

  /edge/v1/field-sync/devices:
    post:
      operationId: enrollFieldDevice
      summary: Enroll device
      tags: [field-sync]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '201':
          description: Enrolled
        '400':
          description: Invalid

  /edge/v1/field-sync/scores:
    post:
      operationId: syncFieldScores
      summary: Sync scores
      tags: [field-sync]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '200':
          description: Synced
        '400':
          description: Malformed

  /edge/v1/field-sync/conflicts/resolve:
    post:
      operationId: resolveFieldSyncConflict
      summary: Resolve conflict
      tags: [field-sync]
      x-usrp-session: officer
      x-usrp-csrf: true
      responses:
        '200':
          description: Resolved
        '404':
          description: Not found

  /edge/health:
    get:
      operationId: edgeHealth
      summary: Health check
      tags: [probes]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      responses:
        '200':
          description: Healthy

  /edge/ready:
    get:
      operationId: edgeReady
      summary: Readiness check
      tags: [probes]
      x-usrp-session: anonymous
      x-usrp-csrf: false
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID key required for each campaign write; same actor, operation, key, and request body replay the original result.
      schema:
        type: string
        format: uuid

tags:
  - name: session
    description: Session management
  - name: officer-auth
    description: Officer authentication
  - name: applicant-auth
    description: Applicant authentication
  - name: campaign-control
    description: Officer-authorized campaign lifecycle and session configuration
  - name: public-campaigns
    description: Safe published campaign catalogue and detail
  - name: officer-reads
    description: Officer reads
  - name: officer-transitions
    description: Officer transitions
  - name: walk-in
    description: Walk-in registration
  - name: identity
    description: Identity verification
  - name: citizen
    description: Citizen self-service
  - name: field-sync
    description: Field sync
  - name: probes
    description: Health probes
