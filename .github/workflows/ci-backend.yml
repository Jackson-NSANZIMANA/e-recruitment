name: USRP Backend CI

# The gate is honest: every job here runs something real. `typecheck` and
# `security-scan` are static; `verify` is the load-bearing one — it boots the
# actual infrastructure, bootstraps the database in the canonical order, and
# runs EVERY proof in the repo (RLS cross-agency isolation + all service
# selfchecks). USRP's quality contract is "prove it, don't assert it"; this
# workflow enforces those proofs on every change instead of trusting that a
# developer ran them once by hand.

on:
  push:
    # feat/** is where slices land first (D0 cadence) — gate them BEFORE main.
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

# A superseded push's run is dead weight — cancel it, keep the newest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from package.json "packageManager" (single source of
      # truth) — passing `version:` too makes action-setup hard-fail.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The real quality gate for source correctness: ultra-strict tsc,
      # zero-error, across every package and service.
      - run: pnpm typecheck

  lint:
    name: Lint (ratchet, baseline 0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # THE RULE THIS JOB OBEYS: never a blocking lint job on top of known
    # failures. It is written as a RATCHET — it fails only when the error
    # count EXCEEDS the baseline — and the baseline is 0 purely because the
    # debt was driven to 0 first (126 -> 0, step 4). So today it is, in
    # effect, blocking; the ratchet form is kept because it is what makes the
    # 0 safe to hold: a regression names its own number instead of dumping an
    # undifferentiated wall of errors, and if a future dependency bump ever
    # introduces unavoidable findings, the baseline can be raised DELIBERATELY
    # and visibly in one line rather than by switching the gate off.
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # MANDATORY, not an optimisation. The rule set is type-aware; without
      # dist/ the workspace imports do not resolve and the run reports ~1200
      # phantom errors. A lint count on an unbuilt tree is meaningless.
      - name: Build workspace (required before linting)
        run: pnpm build
      - name: Count lint errors and enforce the ratchet
        env:
          LINT_BASELINE: '0'
        run: |
          set -euo pipefail
          export LINT_LOG="$PWD/lint.log"
          count="$(bash scripts/count-lint.sh)"
          echo "lint errors: $count   baseline: $LINT_BASELINE"
          if [ "$count" -gt "$LINT_BASELINE" ]; then
            echo "::error::Lint debt increased to $count (baseline $LINT_BASELINE). The offending errors are below and in the lint-log artifact."
            grep -E '  (error|warning)  ' "$LINT_LOG" || true
            exit 1
          fi
          if [ "$count" -lt "$LINT_BASELINE" ]; then
            echo "::notice::Lint debt is down to $count (baseline $LINT_BASELINE). Lower LINT_BASELINE to lock the gain in."
          fi
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log
          if-no-files-found: ignore

  verify:
    name: Proofs (RLS isolation + service selfchecks)
    runs-on: ubuntu-latest
    # Full stack + 33 live proofs; ClamAV's first-boot virus-DB download is
    # the slowest single step on a cold runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # pnpm version from package.json "packageManager" (see typecheck job).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Build the shared packages + services to dist (services run compiled;
      # selfchecks import the workspace packages).
      - name: Build workspace
        run: pnpm build

      # Bring up the SAME infrastructure a developer uses: tier1 (Postgres,
      # MinIO, NIDA/NESA/RIB/HEC mocks) then tier2 (Kafka + topic init).
      # --wait blocks until healthchecks pass, so no arbitrary sleeps.
      - name: Start Tier 1 (data + G2G mocks)
        run: docker compose -f infrastructure/docker/docker-compose.tier1.yml up -d --build --wait

      # Only what the proofs consume: kafka (backbone) + clamav (forensics).
      # schema-registry/kafka-ui are dev tooling — no service or proof touches
      # them (the local gate runs 28/28 green without them running at all).
      # kafka-init is a ONE-SHOT (creates topics, exits 0) — `up --wait`
      # counts any exited container as failure, so start it separately and
      # assert its exit code explicitly. Stricter than dev boots, which never
      # checked topic-init at all.
      - name: Start Tier 2 (Kafka backbone)
        run: |
          docker compose -f infrastructure/docker/docker-compose.tier2.yml up -d --wait kafka clamav
          docker compose -f infrastructure/docker/docker-compose.tier2.yml up -d kafka-init
          INIT_EXIT=$(docker wait usrp-kafka-init)
          docker logs usrp-kafka-init | tail -20
          test "$INIT_EXIT" = "0" || { echo "kafka-init failed (exit $INIT_EXIT)"; exit 1; }

      # Codified canonical bootstrap: db:migrate → rls/0001 → rls/0002.
      - name: Bootstrap database (schema + isolation + audit immutability)
        run: pnpm bootstrap:db

      # THE GATE: run every proof in the repo against live infra. Any
      # regression in isolation, PII, the backbone, or audit immutability
      # turns this red.
      - name: Run all proofs
        env:
          BOOT_TIMEOUT_S: 600
        # tee keeps the runner's own summary line for the evidence bundle.
        # `shell: bash` is load-bearing: the default run shell is `bash -e
        # {0}` WITHOUT pipefail, which would give the step tee's exit code and
        # turn a red proof green. Explicit `bash` runs `bash -eo pipefail`.
        shell: bash
        run: pnpm verify 2>&1 | tee proofs.log
      - name: Upload proofs log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: proofs-log
          path: proofs.log
          if-no-files-found: ignore
      # Surface broker/init logs when the proofs fail — Kafka setup is the
      # most common CI-only failure (see kafka-backbone-proof.md).
      - name: Dump infra logs on failure
        if: failure()
        run: |
          echo '── containers ──';  docker ps -a || true
          echo '── kafka ──';       docker logs usrp-kafka --tail 100 || true
          echo '── kafka-init ──';  docker logs usrp-kafka-init --tail 50 || true
          echo '── postgres ──';    docker logs usrp-postgres --tail 50 || true
          echo '── g2g-sandbox ──'; docker logs usrp-g2g-sandbox --tail 30 || true
          echo '── clamav ──';      docker logs usrp-clamav --tail 50 || true
          echo '── minio ──';       docker logs usrp-minio --tail 30 || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f infrastructure/docker/docker-compose.tier2.yml down -v || true
          docker compose -f infrastructure/docker/docker-compose.tier1.yml down -v || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The tracked-secrets gate (SECRET-ROTATION.md §4). Zero dependencies and
      # before any install, so a registry outage or a broken lockfile cannot
      # skip it. The selftest runs first: it proves the gate still goes red.
      - name: Tracked-secrets gate selftest
        run: node scripts/check-tracked-secrets.mjs --selftest
      - name: Tracked-secrets gate
        run: node scripts/check-tracked-secrets.mjs
      # Pinned to a release — @master is an unpinned supply-chain dependency.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  evidence:
    name: Evidence bundle
    # Runs after every gate, whatever their result, so a red run still leaves a
    # record of what was measured. W0-04: docs cite this artefact instead of
    # hand-written counts and SHAs.
    needs: [typecheck, lint, verify, security-scan]
    # !cancelled(), not always(): a cancelled run (superseded push) leaves no
    # bundle rather than a misleading partial one.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs repository code after install; read-only whatever the repository
    # default becomes. Same-run artefact download needs no token scope.
    permissions:
      contents: read
    env:
      EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The operation inventory is read from the built registry, and the unit
      # suites import workspace packages from dist/.
      # A red build must not cost the bundle: the collector records the
      # inventory as unavailable and exits non-zero after writing.
      - name: Build workspace
        id: build
        continue-on-error: true
        run: pnpm build
      - name: Fetch the proofs log
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: proofs-log
          path: proofs
      # Runs every package's unit suite (pnpm verify does not), then writes the
      # bundle. Exits non-zero on a failed test, after writing it.
      - name: Write evidence bundle
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/evidence-bundle.mjs --out evidence --proofs-log proofs/proofs.log --run-tests --needs "$NEEDS"
      # Named by the commit CI actually tested (the merge commit on a
      # pull_request run), so push and PR runs of one head never share a name.
      - name: Upload evidence bundle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: evidence/evidence-${{ env.EVIDENCE_HEAD_SHA }}.json
          if-no-files-found: error

  # ── S03 (ADR-038): unit suites as a gate, images, release bundle ──────────

  unit-tests:
    name: Unit tests (every package)
    # The unit suites used to run only inside the ungated evidence job, so a
    # red unit test could not block a merge. This job makes them a signal of
    # their own; branch protection decides whether it is required.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Unit suites import workspace packages from dist/.
      - name: Build workspace
        run: pnpm build
      # --continue: every package's result is reported, not just the first red.
      - name: Every package's unit suite
        run: pnpm turbo run test --continue
      - name: Script regression tests (evidence, release bundle, env preflight)
        run: pnpm test:scripts

  images:
    name: Image (${{ matrix.service }})
    # PRs build and scan without publishing; main publishes. feat/** pushes are
    # covered by their PR run, so they do not build twelve images twice.
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # packages/id-token are used only by the steps gated on PUBLISH (main).
    # A pull_request token from a fork is read-only whatever this says, and a
    # same-repo branch author can already edit this file, so the grant widens
    # nothing; no step before PUBLISH runs repository code outside BuildKit.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - application-service
          - audit-service
          - background-vetting-service
          - biometric-service
          - document-forensics-service
          - edge-gateway
          - eligibility-service
          - field-sync-service
          - iam-service
          - identity-service
          - notification-service
          - scheduling-service
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: ghcr.io/jackson-nsanzimana/usrp-${{ matrix.service }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SIZE_BUDGET_BYTES: '300000000'
      # Same Trivy as the frontend pipeline, so the two repos cannot reach
      # different verdicts on the same base image.
      TRIVY_VERSION: '0.70.0'
      COSIGN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci-backend.yml@refs/heads/main
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build facts
        id: facts
        run: |
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          mkdir -p out
      # Loaded into the runner's daemon, not pushed: the bytes that are scanned
      # below are the bytes that are pushed and signed, never a rebuild.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            USRP_BUILD_SHA=${{ github.sha }}
            USRP_BUILD_REF=${{ github.ref }}
            USRP_BUILD_TIME=${{ steps.facts.outputs.time }}
          cache-from: type=gha,scope=svc-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=svc-${{ matrix.service }}
      - name: Size budget
        id: size
        run: |
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE:$GITHUB_SHA")
          echo "bytes=$size" >> "$GITHUB_OUTPUT"
          echo "$SERVICE: $size bytes (budget $SIZE_BUDGET_BYTES)"
          if [ "$size" -gt "$SIZE_BUDGET_BYTES" ]; then
            echo "::error::$SERVICE is $size bytes, over its $SIZE_BUDGET_BYTES budget (ADR-038)."
            exit 1
          fi
      # Blocking: any fixable CRITICAL/HIGH fails the job unless it is
      # registered (with an expiry) in infrastructure/images/trivy-exceptions.yaml.
      - name: Scan (Trivy, CRITICAL/HIGH blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: infrastructure/images/trivy-exceptions.yaml
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
        with:
          version: v${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: out/trivy.json
          exit-code: '1'
      - name: Show findings
        if: ${{ failure() }}
        run: |
          [ -f out/trivy.json ] || { echo "no Trivy report: the scanner did not run (could not verify)"; exit 0; }
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)\t\($t)"' out/trivy.json
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
        with:
          version: v${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: cyclonedx
          output: out/sbom.cdx.json
          exit-code: '0'

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image
        id: push
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          ref=$(docker image inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "pushed $ref"
      - uses: sigstore/cosign-installer@v4.1.2
        if: ${{ env.PUBLISH == 'true' }}
        with:
          cosign-release: v3.1.3
      # Keyless: the certificate binds the signature to THIS workflow on main
      # (GitHub OIDC); nothing to rotate, nothing to leak. Signed by digest,
      # so a later tag of the same digest carries the same signature.
      - name: Sign, attest the SBOM, verify both
        if: ${{ env.PUBLISH == 'true' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate out/sbom.cdx.json "$ref"
          cosign verify --certificate-identity "$COSIGN_IDENTITY" --certificate-oidc-issuer "$COSIGN_ISSUER" "$ref" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$COSIGN_IDENTITY" --certificate-oidc-issuer "$COSIGN_ISSUER" "$ref" > /dev/null
          echo "signed and verified: $ref"
      - name: Image metadata
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SIZE: ${{ steps.size.outputs.bytes }}
        run: |
          signed=false; [ -n "$DIGEST" ] && signed=true
          jq -n --arg name "$SERVICE" --arg image "$IMAGE" --arg digest "$DIGEST" --arg sha "$GITHUB_SHA" \
                --argjson size "$SIZE" --argjson budget "$SIZE_BUDGET_BYTES" --argjson signed "$signed" \
                --arg identity "$COSIGN_IDENTITY" --arg issuer "$COSIGN_ISSUER" \
            '{name: $name, image: $image, digest: (if $digest == "" then null else $digest end), tags: [$sha],
              sizeBytes: $size, sizeBudgetBytes: $budget, sbom: "sbom.cdx.json", scan: "trivy.json",
              signed: $signed, attested: $signed,
              signerIdentity: (if $signed then $identity else null end), signerIssuer: (if $signed then $issuer else null end)}' \
            > out/metadata.json
          cat out/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: out/
          if-no-files-found: error

  release-bundle:
    name: Release bundle (dry run on PRs, candidate on main)
    # The composer the v* release workflow runs, exercised on every PR against
    # this run's own artefacts (nothing pushed, so no digests) and on main
    # against the published, signed images.
    needs: [images, evidence]
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MODE: ${{ github.event_name == 'push' && 'candidate' || 'dry-run' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: evidence-${{ github.sha }}
          path: evidence
      - name: Compose
        run: >-
          node scripts/release-bundle.mjs --mode "$MODE" --tag "$MODE-$EVIDENCE_HEAD_SHA"
          --sha "$EVIDENCE_HEAD_SHA" --images images --evidence "evidence/evidence-$EVIDENCE_HEAD_SHA.json"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.MODE }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
